pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // 官方仓库优先：GitHub Actions 在国外，google()/mavenCentral() 更稳定
        google()
        mavenCentral()
        // JitPack 必须排在阿里云镜像前：BlurView / WheelPicker 等是 JitPack 构件，
        // 阿里云 public 镜像没有这些包，且偶发 502 会让 Gradle 直接终止、走不到后面的 JitPack。
        maven { url = uri("https://jitpack.io") }
        // 国内镜像只作为最后 fallback，便于本地开发加速
        maven { url = uri("https://maven.aliyun.com/repository/public") }
    }
}

rootProject.name = "DailyTask"
include ':app'
include ':lite'
include ':protocol'
