name: Emulator Smoke Test (Android 17)

on:
  workflow_dispatch:
  push:
    branches: [alpha]
    paths:
      - 'app/**'
      - 'lite/**'
      - 'protocol/**'
      - 'build.gradle'
      - 'gradle/wrapper/**'

jobs:
  android17-smoke:
    name: Android 17 (API 37) 冒烟验证
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BUILD_FLAVOR: alpha
      GIT_COMMIT_SHORT: ${{ github.sha }}
      BUILD_SOURCE: ci
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # API 37 平台/镜像包名带 .0 后缀（android-37.0），
      # 常见 emulator-runner action 写死 android-37 无法解析，故这里手动装 SDK + 启动模拟器。
      - name: Install Android 17 platform + system image
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install 'platforms;android-37.0' 'platform-tools' 'emulator' > /dev/null
          sdkmanager --install 'system-images;android-37.0;google_apis_ps16k;x86_64' > /dev/null
          echo "installed:"
          sdkmanager --list_installed | grep -E "android-37|emulator"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd -n android17 -k "system-images;android-37.0;google_apis_ps16k;x86_64" -d pixel_6 --force
          echo "avd created"

      - name: Boot emulator
        run: |
          nohup emulator -avd android17 -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -no-metrics > emulator.log 2>&1 &
          echo "emulator started"

      - name: Wait for boot + smoke test
        run: |
          adb wait-for-device
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "boot completed after ${i}x5s"
              break
            fi
            sleep 5
          done
          RELEASE=$(adb shell getprop ro.build.version.release | tr -d '\r')
          echo "Android release: $RELEASE"
          test "$RELEASE" = "17" || { echo "::error::Expected Android 17, got $RELEASE"; exit 1; }
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n com.pengxh.daily.app/.ui.MainActivity
          sleep 8
          PID=$(adb shell pidof com.pengxh.daily.app | tr -d '\r')
          echo "app pid = $PID"
          if [ -z "$PID" ]; then
            echo "::error::App process not running on Android 17"
            adb logcat -d -t 200 | tail -40
            exit 1
          fi
          CRASH=$(adb logcat -d -t 500 | grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL" | head -5)
          if [ -n "$CRASH" ]; then
            echo "::error::App crashed on Android 17:"
            echo "$CRASH"
            exit 1
          fi
          echo "::notice::DailyTask smoke test passed on Android 17 (API 37)"

      - name: Upload emulator log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: emulator.log
          retention-days: 7
