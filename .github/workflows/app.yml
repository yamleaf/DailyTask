name: Build Apk

on:
  push:
    branches: [alpha]
  workflow_dispatch:
    inputs:
      note:
        description: '更新说明（同步到 Gitee Release；多行请用 \n 分隔）'
        required: false
        default: '常规更新'
      force:
        description: '强制更新（true 时 App 必须更新）'
        required: false
        default: 'false'
      package_name:
        description: '自定义包名（留空用默认 com.pengxh.daily.app；至少两段如 com.example.daily，产物文件名带 _custom）'
        required: false
        default: ''
      shizuku_pkg:
        description: '自定义 Shizuku 包名（留空=不启用自定义 shizuku，仅官方通道；非空如 com.exmple.custom.shizuku=启用自定义 shizuku，自动拉取 Shizuku alpha 改名并编译 manager release + api jar，DT 编双通道）'
        required: false
        default: ''

permissions:
  contents: write
  # 自动编译限流：时间戳存 GitHub Actions Cache（GITHUB_TOKEN 可读写 cache；
  # repository variables API 对 GITHUB_TOKEN 写受限 403，故改用 cache，不污染仓库提交历史）
  actions: write

jobs:
  # 自动编译限流：时间戳存 GitHub Actions Cache（不再写入仓库文件/提交，避免每次自动编译
  # 都产生一条 [ci skip] 噪音 commit）。cache key 带 run_id 保证每次唯一可写；
  # restore 用 restore-keys 前缀匹配取最新一条。manual 直接放行；push 走"每小时一次"检查
  # （build 成功后 save 新时间戳条目）。
  rate-check:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      # 恢复上次自动编译时间戳（cache 命中即拿到最近一次 save 的值）
      - name: Restore last auto build timestamp (Actions cache)
        uses: actions/cache/restore@v4
        with:
          path: last_auto_build
          key: last-auto-build-${{ github.ref_name }}
          restore-keys: last-auto-build-${{ github.ref_name }}
      - name: Rate limit auto builds (once per hour)
        id: check
        run: |
          # 手动触发不参与限流
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "manual trigger 不参与限流"
            exit 0
          fi
          NOW=$(date +%s)
          if [ -f last_auto_build ]; then
            LAST=$(cat last_auto_build)
          else
            LAST=0
          fi
          LAST=${LAST:-0}
          if [ "$LAST" -gt 0 ] && [ "$((NOW - LAST))" -lt 3600 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "距上次自动编译不足 1 小时，跳过本次自动编译（上次 $LAST）"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "自动编译限流放行（上次 $LAST，距现在 $((NOW - LAST)) 秒）"
          fi

  build:
    needs: rate-check
    # rate-check 永远会跑并输出 allowed：push 走限流/manual 直接放行
    if: needs.rate-check.outputs.allowed == 'true'
    name: Start Build
    runs-on: ubuntu-latest

    # alpha 构建：注入环境变量，build.gradle 据此生成
    # versionName = alpha-<编译时间 yyyyMMddHHmm>-<git短哈希>
    # versionCode = 自增构建号（单调递增，来自 github.run_number）
    env:
      BUILD_FLAVOR: alpha
      GIT_COMMIT_SHORT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      # 构建来源标识：CI 产物版本号带 -ci 后缀，本机手工编译带 -local，便于一眼区分包的出处。
      # GITHUB_ACTIONS 环境变量本可自动识别，此处显式声明以防迁移到其他 CI 时失效。
      BUILD_SOURCE: ci
      # secrets 不能直接出现在 step 的 if 表达式里，故先落到 job 级 env，
      # 未配置 Secret 时该变量为空字符串，if 判断按 env. 读取。
      APK_ENCRYPT_PASSWORD: ${{ secrets.APK_ENCRYPT_PASSWORD }}
      # 签名：统一 Secret 命名（与 Shizuku app.yml 一致）。定义了 KEY_STORE 时用外部密钥
      # 覆盖内置 DailyTask.jks，未定义时 build.gradle 回退到仓库内置默认签名。四个为一组，需同时配齐。
      KEY_STORE: ${{ secrets.KEY_STORE }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # 发版已改为本地执行（scripts/publish_local.sh）：GitHub CI（美国）跨境上传
      # Gitee（国内）极慢（实测 >9min），本地跑 ~30s。故 CI 不再持有 Gitee 凭据；
      # 本地发版需 GITEE_TOKEN（写权限）+ VERSION_KEY（与 App 内置一致）。

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;28.2.13676358 ndk;29.0.14206865 cmake;3.31.6'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show generated version info
        run: |
          echo "BUILD_FLAVOR=$BUILD_FLAVOR"
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "BUILD_SOURCE=$BUILD_SOURCE"

      # CI runner 在 GitHub（境外），腾讯镜像偶发连接超时（run #77）；本地开发仍是国内网络，
      # 保留腾讯镜像。此处仅 CI 内把 distributionUrl 改写为官方源，wrapper 缓存目录按 URL 哈希
      # 区分，改写后下载走 services.gradle.org，更稳。官方源极少抖动，下面预热重试 5 次兜底即可。
      - name: Use official Gradle distribution in CI
        run: |
          # 只替换镜像主机+路径前缀，保留 properties 的 \: 转义写法（sed 里 \: 会匹配普通冒号，
          # 直接匹配含转义的 URL 会失效）；替换后 URL 变为 https\://services.gradle.org/distributions/...
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle#services.gradle.org/distributions#g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Warm up Gradle wrapper (retry)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && break
            echo "wrapper download attempt $i failed, retrying in 5s"
            sleep 5
          done
          ./gradlew --version

      # ==== 编译工具链版本与支持版本信息（参考 Shizuku app CI 风格）====
      - name: Show build toolchain versions
        run: |
          echo "---- JDK ----"
          java -version 2>&1
          echo "---- Gradle ----"
          ./gradlew --version 2>&1 | sed -n '1,8p'
          echo "---- App SDK targets (app/build.gradle) ----"
          grep -E "compileSdk|targetSdk|minSdk" app/build.gradle | sed 's/^[[:space:]]*//'
          echo "---- AGP / Kotlin (build.gradle) ----"
          grep -E "com.android.application|com.android.library|org.jetbrains.kotlin.android" build.gradle | sed 's/^[[:space:]]*//'
          echo "---- Installed build-tools ----"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(none)"
          echo "---- Installed NDK ----"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(none)"
          echo "---- Installed CMake ----"
          ls "$ANDROID_HOME/cmake" 2>/dev/null || echo "(none)"

      # ==== 签名：若定义了 KEY_STORE，用外部密钥覆盖仓库内置 DailyTask.jks；
      # 未定义则跳过，build.gradle 回退到内置默认签名 ====
      - name: Apply signing secret (override default jks)
        run: |
          if [ -n "$KEY_STORE" ]; then
            printf '%s' "$KEY_STORE" | base64 -d > app/DailyTask.jks
            echo "已用外部 Secret 签名密钥覆盖 DailyTask.jks"
          else
            echo "未定义签名 Secret，使用仓库内置默认签名"
          fi

      - name: Compute git short hash
        run: |
          echo "GIT_HASH_SHORT=${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"

      # ===== 自定义 Shizuku（可选）：仅在 workflow_dispatch 传了 shizuku_pkg 时执行 =====
      # 拉取 yamleaf/Shizuku alpha → rename 改名 → 编 manager release + api jar，
      # 产物导出到 CUSTOM_SHIZUKU_* 环境变量供下方 DT Build 使用。
      - name: Build custom Shizuku (optional)
        if: inputs.shizuku_pkg != ''
        env:
          SHIZUKU_PKG: ${{ inputs.shizuku_pkg }}
        run: |
          bash scripts/build_custom_shizuku.sh

      - name: Upload custom Shizuku manager (optional)
        if: inputs.shizuku_pkg != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CUSTOM_SHIZUKU_ART_NAME }}
          path: custom_shizuku_artifacts/*.apk
          retention-days: 10
          if-no-files-found: error

      - name: Upload custom Shizuku api jar (optional)
        if: inputs.shizuku_pkg != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CUSTOM_SHIZUKU_ART_NAME }}-api-jar
          path: custom_shizuku_artifacts/*.jar
          retention-days: 10
          if-no-files-found: error

      # 自定义 Shizuku 的 R8 mapping：Shizuku 崩溃栈是混淆名（如 b50/g80/CN），
      # 没有 mapping 无法反混淆定位。manager release 已开 minifyEnabled true，mapping 必然产出；
      # 但 AGP 版本升级可能改变输出路径，故用 find 定位而非写死路径，避免路径变更导致漏传。
      - name: Collect custom Shizuku R8 mapping (optional)
        if: inputs.shizuku_pkg != ''
        run: |
          set -euo pipefail
          mkdir -p custom_shizuku_artifacts
          found="$(find shizuku-custom -type f -name 'mapping.txt' -path '*release*' 2>/dev/null | head -1 || true)"
          if [[ -z "$found" ]]; then
            echo "::warning::未找到 Shizuku R8 mapping.txt，混淆堆栈将无法反混淆"
            echo "---- shizuku-custom 下 mapping 目录 ----"
            find shizuku-custom -type d -name 'mapping' 2>/dev/null || true
            exit 0
          fi
          echo "找到 mapping: $found"
          cp "$found" custom_shizuku_artifacts/shizuku-mapping.txt

      - name: Upload custom Shizuku R8 mapping (optional)
        if: inputs.shizuku_pkg != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CUSTOM_SHIZUKU_ART_NAME }}-mapping
          path: custom_shizuku_artifacts/shizuku-mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Build release APK (alpha)
        env:
          # 经 env 传递再判空，避免 inputs 直接内插 shell 造成注入
          CUSTOM_PACKAGE: ${{ inputs.package_name }}
        run: |
          # 手动触发可传自定义包名（inputs 仅 workflow_dispatch 有值，push 触发为空走默认包名）；
          # 格式校验在 build.gradle 内做，非法包名直接构建失败
          # 自定义 shizuku：CUSTOM_SHIZUKU_PKG 由上个步骤写入环境变量，非空即启用双通道编译
          if [ -n "$CUSTOM_SHIZUKU_PKG" ] && [ -n "$CUSTOM_SHIZUKU_LIB" ]; then
            echo "使用自定义 Shizuku: $CUSTOM_SHIZUKU_PKG"
            if [ -n "$CUSTOM_PACKAGE" ]; then
              ./gradlew assembleRelease --no-daemon -PappPackageId="$CUSTOM_PACKAGE" \
                -PcustomShizukuPkg="$CUSTOM_SHIZUKU_PKG" -PcustomShizukuLib="$CUSTOM_SHIZUKU_LIB"
            else
              ./gradlew assembleRelease --no-daemon \
                -PcustomShizukuPkg="$CUSTOM_SHIZUKU_PKG" -PcustomShizukuLib="$CUSTOM_SHIZUKU_LIB"
            fi
          elif [ -n "$CUSTOM_PACKAGE" ]; then
            echo "使用自定义包名: $CUSTOM_PACKAGE"
            ./gradlew assembleRelease --no-daemon -PappPackageId="$CUSTOM_PACKAGE"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      # ===== 加密 APK（7z AES-256，密码=APK_ENCRYPT_PASSWORD）：对所有触发执行，
      # 上传到 artifact 与上传到 release 复用同一加密产物，保证二者一致 =====
      - name: Encrypt APK (7z AES-256)
        run: |
          pip install py7zr -q
          python3 - <<'EOF'
          import glob, os, py7zr
          apk = glob.glob('app/build/outputs/apk/release/*.apk')[0]
          out = 'dailyTask_release_%s.7z' % os.path.basename(apk)
          pw = os.environ.get('APK_ENCRYPT_PASSWORD', '')
          if not pw:
              raise SystemExit('APK_ENCRYPT_PASSWORD 未配置，无法加密 artifact')
          with py7zr.SevenZipFile(out, 'w', password=pw) as z:
              z.write(apk, os.path.basename(apk))
          print('加密包:', out)
          EOF

      # ===== 上传加密后的 7z 到 artifact（不再上传明文 APK）=====
      # 名称带 git 短哈希：每次构建独立、可并存，便于识别来源 commit；
      # retention-days 作为兜底，防止清理步骤偶发未执行时无限堆积。
      - name: Upload encrypted release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_release_${{ env.GIT_HASH_SHORT }}
          path: dailyTask_release_*.7z
          retention-days: 10

      # ===== 上传 ProGuard mapping（release 已开启 minify，用于崩溃堆栈反混淆）=====
      - name: Upload ProGuard mapping
        if: hashFiles('app/build/outputs/mapping/release/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_mapping_${{ github.run_number }}
          path: app/build/outputs/mapping/release
          retention-days: 30
          if-no-files-found: ignore

      # ===== 手动触发：dump APK 版本号，供 GitHub Release Draft 展示（版本信息发版在本地执行） =====
      # 自定义包名构建与默认包名同流程：同样走版本提取 → 7z 加密 → Release Draft（tag=dt-{versionCode}）。
      # sync_release.py 按 tag/版本号同步 Gitee，对包名无感知——Gitee 更新通道始终跟随最新一次手动构建
      # （注意：custom 包为最新版期间，默认包名用户会收到无法安装的更新提示，属预期行为）。
      - name: Extract version from APK (aapt)
        if: github.event_name == 'workflow_dispatch'
        id: gitee_version
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          AAPT=$ANDROID_HOME/build-tools/37.0.0/aapt
          BADGING=$($AAPT dump badging "$APK")
          VC=$(echo "$BADGING" | grep -oP "versionCode='\K[0-9]+" | head -1)
          VN=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" | head -1)
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ===== 发版（上传 APK + .dat 到 Gitee）已改为本地执行 =====
      # 原因：GitHub CI（美国）跨境上传 Gitee（国内）极慢（实测 >9min），
      # 本地跑 scripts/publish_local.sh 约 30s（clone 4s + push 14s + API 几秒）。
      # 发版命令示例：
      #   GITEE_TOKEN=<写权限令牌> bash scripts/publish_local.sh --note "更新说明"

      # ===== 手动触发：生成 GitHub Release Draft（标题 DailyTask Alpha yymmdd.HHmm，
      # body 总结自上次 release tag 以来的提交记录） =====
      - name: Prepare GitHub Release info (title date + body commits)
        if: github.event_name == 'workflow_dispatch'
        id: gh_release_info
        env:
          # 经 env 传递再判空，避免 inputs 直接内插 shell 造成注入
          CUSTOM_PACKAGE: ${{ inputs.package_name }}
        run: |
          # 标题日期时间（北京时间 yymmdd.HHmm，例 260816.1435 = 2026-08-16 14:35）
          TITLE_DATE=$(TZ='Asia/Shanghai' date +%y%m%d.%H%M)
          echo "title_date=$TITLE_DATE" >> "$GITHUB_OUTPUT"

          # 包名标识：仅自定义包名构建标注「自定义包名」（不暴露具体包名），默认构建不加此行
          if [ -n "$CUSTOM_PACKAGE" ]; then
            PKG_LINE="- 包名: 自定义包名"
          else
            PKG_LINE=""
          fi

          # 自上次 release tag（apk-*）起的提交记录；无 tag 时取最近 10 条
          LAST_TAG=$(git tag --list "apk-*" --sort=-version:refname 2>/dev/null | head -1)
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            RANGE_DESC="自 ${LAST_TAG}"
          else
            RANGE="HEAD~10..HEAD"
            RANGE_DESC="最近 10 条"
          fi

          # 多行 body 用 GitHub Actions 多行输出语法（delimiter 包裹）
          # workflow_dispatch 的 note 输入框是单行 input（GitHub UI 限制，无法多行粘贴），
          # 约定用字面 \n 表示换行，这里还原成真换行写进 release body
          NOTE_FMT=$(printf '%s' "${{ inputs.note }}" | sed 's/\\n/\n/g')
          {
            echo "body<<GITEOF"
            echo "### 更新内容（${RANGE_DESC}）"
            echo ""
            git log --pretty=format:"- %s (%h)" "$RANGE" | head -20
            echo ""
            echo "---"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- versionCode: ${{ steps.gitee_version.outputs.version_code }}"
            echo "- versionName: \`${{ steps.gitee_version.outputs.version_name }}\`"
            if [ -n "$PKG_LINE" ]; then echo "$PKG_LINE"; fi
            printf -- "- update note:\n%s\n" "$NOTE_FMT"
            echo "GITEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (encrypted APK, for Gitee Go sync)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # tag 用 versionCode，Gitee Go 据此解析版本号；body 含 versionName/note（Gitee Go 正则提取）
          tag_name: dt-${{ steps.gitee_version.outputs.version_code }}
          name: DailyTask Alpha ${{ steps.gh_release_info.outputs.title_date }}
          body: ${{ steps.gh_release_info.outputs.body }}
          files: |
            dailyTask_release_*.7z
            # 启用自定义 shizuku 时，把其 manager APK 与 api jar 一并发布；未启用则通配符匹配不到、不影响
            custom_shizuku_artifacts/*.apk
            custom_shizuku_artifacts/*.jar

      # 自动构建成功：把当前时间戳写入 GitHub Actions Cache（rate-check 据此限流）。
      # 不用 git commit，避免每次自动编译都产生一条 [ci skip] 噪音提交污染仓库历史。
      # 时间戳文件本身无需 git 跟踪（不入库）。
      - name: Record last auto build timestamp (Actions cache)
        if: github.event_name == 'push'
        run: |
          echo "$(date +%s)" > last_auto_build

      # cache 条目不可覆盖：保存仍用唯一 key（run_id 保证 save 永不报 already-exists），
      # 保存后立即清理同前缀旧条目——缓存里始终只有当前这一条，不再每次构建堆积新记录。
      - name: Save last auto build timestamp (unique key)
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: last_auto_build
          key: last-auto-build-${{ github.ref_name }}-${{ github.run_id }}

      # 清理同前缀旧条目（含历史堆积）：删除除刚保存 run_id 外的所有 last-auto-build-<branch>-*
      - name: Prune old timestamp caches (keep only latest)
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = `last-auto-build-${context.ref.replace('refs/heads/', '')}`;
            const keepKey = `${prefix}-${context.runId}`;
            const { data } = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: prefix,
              per_page: 100,
            });
            let removed = 0;
            for (const c of data.actions_caches || []) {
              if (c.key === keepKey) continue;
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: c.id,
              });
              removed++;
            }
            console.log(`pruned ${removed} old timestamp cache(s), kept ${keepKey}`)
