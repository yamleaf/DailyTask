name: Build Alpha（AI优化版本）

on:
  push:
    branches: [alpha]
  workflow_dispatch:
    inputs:
      note:
        description: '更新说明（同步到 Gitee Release）'
        required: false
        default: '常规更新'
      force:
        description: '强制更新（true 时 App 必须更新）'
        required: false
        default: 'false'

permissions:
  contents: write
  # 自动编译限流需要读写 repository variable（LAST_AUTO_BUILD 时间戳）
  actions: write

jobs:
  # 自动编译限流（仅 push 触发）：repository variable LAST_AUTO_BUILD 记录上次自动构建时间，
  # 距上次 < 3600s 则跳过本次构建（显示灰色跳过）；手动触发不走此 job，不受限。
  rate-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Rate limit auto builds (once per hour)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date +%s)
          LAST=$(gh variable get LAST_AUTO_BUILD --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo 0)
          if [ "$LAST" -gt 0 ] && [ "$((NOW - LAST))" -lt 3600 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "距上次自动编译不足 1 小时，跳过本次自动编译（上次 $LAST）"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            gh variable set LAST_AUTO_BUILD "$NOW" --repo "$GITHUB_REPOSITORY"
            echo "自动编译限流已放行并记录时间戳 $NOW"
          fi

  build:
    needs: rate-check
    # 手动触发直接构建；push 触发需 rate-check 放行（allowed=true）
    if: ${{ github.event_name == 'workflow_dispatch' || needs.rate-check.outputs.allowed == 'true' }}
    name: Build APK(alpha自动版本)
    runs-on: ubuntu-latest

    # alpha 构建：注入环境变量，build.gradle 据此生成
    # versionName = alpha-<编译时间 yyyyMMddHHmm>-<git短哈希>
    # versionCode = 自增构建号（单调递增，来自 github.run_number）
    env:
      BUILD_FLAVOR: alpha
      GIT_COMMIT_SHORT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      # 构建来源标识：CI 产物版本号带 -ci 后缀，本机手工编译带 -local，便于一眼区分包的出处。
      # GITHUB_ACTIONS 环境变量本可自动识别，此处显式声明以防迁移到其他 CI 时失效。
      BUILD_SOURCE: ci
      # secrets 不能直接出现在 step 的 if 表达式里，故先落到 job 级 env，
      # 未配置 Secret 时该变量为空字符串，if 判断按 env. 读取。
      APK_ENCRYPT_PASSWORD: ${{ secrets.APK_ENCRYPT_PASSWORD }}
      # Gitee 公开镜像仓库（App 检查更新数据源），GITEE_TOKEN 需有该仓库写权限
      GITEE_OWNER: 'yamleaf'
      GITEE_REPO: 'DailyTask'
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      VERSION_KEY: ${{ secrets.VERSION_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;21.4.7075529 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show generated version info
        run: |
          echo "BUILD_FLAVOR=$BUILD_FLAVOR"
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "BUILD_SOURCE=$BUILD_SOURCE"

      # CI runner 在 GitHub（境外），腾讯镜像偶发连接超时（run #77）；本地开发仍是国内网络，
      # 保留腾讯镜像。此处仅 CI 内把 distributionUrl 改写为官方源，wrapper 缓存目录按 URL 哈希
      # 区分，改写后下载走 services.gradle.org，更稳。官方源极少抖动，下面预热重试 5 次兜底即可。
      - name: Use official Gradle distribution in CI
        run: |
          # 只替换镜像主机+路径前缀，保留 properties 的 \: 转义写法（sed 里 \: 会匹配普通冒号，
          # 直接匹配含转义的 URL 会失效）；替换后 URL 变为 https\://services.gradle.org/distributions/...
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle#services.gradle.org/distributions#g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Warm up Gradle wrapper (retry)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && break
            echo "wrapper download attempt $i failed, retrying in 5s"
            sleep 5
          done
          ./gradlew --version

      - name: Build debug APK (alpha)
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (alpha)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_release
          path: app/build/outputs/apk/release/*.apk

      # ===== 手动触发才执行：debug/release 两个 APK 分别用 7z AES-256 加密压缩并推到 GitHub Release =====
      # 密码从 Secret APK_ENCRYPT_PASSWORD 读取（未配置时此段整体跳过，不影响 push 自动构建）。
      # -mhe=on 同时加密文件头，不解密连文件名都看不到。
      - name: Encrypt & compress APKs (7z AES-256)
        if: github.event_name == 'workflow_dispatch' && env.APK_ENCRYPT_PASSWORD != ''
        env:
          APK_ENCRYPT_PASSWORD: ${{ secrets.APK_ENCRYPT_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mkdir -p release tmp_debug tmp_release
          cp app/build/outputs/apk/debug/*.apk tmp_debug/
          cp app/build/outputs/apk/release/*.apk tmp_release/
          # debug / release 分开压缩加密，便于只下载需要的包
          cd tmp_debug && 7z a -t7z -p"$APK_ENCRYPT_PASSWORD" -mhe=on -mx=9 ../release/dailyTask_debug_${{ github.sha }}.7z *.apk && cd ..
          cd tmp_release && 7z a -t7z -p"$APK_ENCRYPT_PASSWORD" -mhe=on -mx=9 ../release/dailyTask_release_${{ github.sha }}.7z *.apk && cd ..
          rm -rf tmp_debug tmp_release
          ls -la release

      - name: Publish encrypted APKs to GitHub Release
        if: github.event_name == 'workflow_dispatch' && env.APK_ENCRYPT_PASSWORD != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.BUILD_NUMBER }}
          name: DailyTask alpha 加密 APK（build #${{ env.BUILD_NUMBER }}）
          body: |
            加密压缩包：7z AES-256（-mhe=on），密码见仓库 Secret `APK_ENCRYPT_PASSWORD`。
            debug 与 release 已分开压缩：`dailyTask_debug_<sha>.7z` / `dailyTask_release_<sha>.7z`。
            commit: ${{ github.sha }}
          files: release/*.7z
          draft: true

      # ===== 手动触发才执行：同步到 Gitee 公开镜像 Release（AES 加密 APK + 加密版本文件） =====
      # App「检查更新」从 Gitee 拉取 .dat（XOR 密文）→ 下载 AES 密文 APK → 内置密钥解密安装。
      # 需配置 Secrets：GITEE_TOKEN（Gitee 写权限令牌）、VERSION_KEY（与 App 内置一致）。
      - name: Extract version from APK (aapt)
        if: github.event_name == 'workflow_dispatch'
        id: gitee_version
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          AAPT=$ANDROID_HOME/build-tools/36.0.0/aapt
          BADGING=$($AAPT dump badging "$APK")
          VC=$(echo "$BADGING" | grep -oP "versionCode='\K[0-9]+" | head -1)
          VN=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" | head -1)
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish AES-encrypted APK + version file to Gitee Release
        if: github.event_name == 'workflow_dispatch' && env.GITEE_TOKEN != ''
        run: |
          python3 scripts/publish_gitee.py \
            --version-code "${{ steps.gitee_version.outputs.version_code }}" \
            --version-name "${{ steps.gitee_version.outputs.version_name }}" \
            --apk "${{ steps.gitee_version.outputs.apk }}" \
            --tag "dailyTask-${{ env.BUILD_NUMBER }}" \
            --note "${{ inputs.note }}" \
            --force "${{ inputs.force == 'true' && '1' || '0' }}" \
            --owner "$GITEE_OWNER" \
            --repo "$GITEE_REPO" \
            --token "$GITEE_TOKEN" \
            --key "$VERSION_KEY"
