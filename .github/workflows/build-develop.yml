name: Build Alpha（AI优化版本）

on:
  push:
    branches: [alpha]
  workflow_dispatch:
    inputs:
      note:
        description: '更新说明（同步到 Gitee Release）'
        required: false
        default: '常规更新'
      force:
        description: '强制更新（true 时 App 必须更新）'
        required: false
        default: 'false'

permissions:
  contents: write
  # 自动编译限流需要读写 repository variable（LAST_AUTO_BUILD 时间戳）
  actions: write

jobs:
  # 自动编译限流：时间戳存仓库文件 last_auto_build（GITHUB_TOKEN 写仓库 contents 必然可用，
  # 而 repository variables API 对 GITHUB_TOKEN 写受限 403）。manual 直接放行；push 走
  # "每小时一次"检查（build 成功后会更新该文件，commit 带 [ci skip] 防递归触发）。
  rate-check:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Rate limit auto builds (once per hour)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 手动触发不参与限流
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "manual trigger 不参与限流"
            exit 0
          fi
          NOW=$(date +%s)
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/contents/last_auto_build" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo 0)
          LAST=${LAST:-0}
          if [ "$LAST" -gt 0 ] && [ "$((NOW - LAST))" -lt 3600 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "距上次自动编译不足 1 小时，跳过本次自动编译（上次 $LAST）"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "自动编译限流放行（上次 $LAST，距现在 $((NOW - LAST)) 秒）"
          fi

  build:
    needs: rate-check
    # rate-check 永远会跑并输出 allowed：push 走限流/manual 直接放行
    if: needs.rate-check.outputs.allowed == 'true'
    name: Build APK(alpha自动版本)
    runs-on: ubuntu-latest

    # alpha 构建：注入环境变量，build.gradle 据此生成
    # versionName = alpha-<编译时间 yyyyMMddHHmm>-<git短哈希>
    # versionCode = 自增构建号（单调递增，来自 github.run_number）
    env:
      BUILD_FLAVOR: alpha
      GIT_COMMIT_SHORT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      # 构建来源标识：CI 产物版本号带 -ci 后缀，本机手工编译带 -local，便于一眼区分包的出处。
      # GITHUB_ACTIONS 环境变量本可自动识别，此处显式声明以防迁移到其他 CI 时失效。
      BUILD_SOURCE: ci
      # secrets 不能直接出现在 step 的 if 表达式里，故先落到 job 级 env，
      # 未配置 Secret 时该变量为空字符串，if 判断按 env. 读取。
      APK_ENCRYPT_PASSWORD: ${{ secrets.APK_ENCRYPT_PASSWORD }}
      # Gitee 私密仓库（App 检查更新数据源，仅发布/内置只读令牌者可见），GITEE_TOKEN 需有写权限
      GITEE_OWNER: 'yamleaf'
      GITEE_REPO: '改成你的私密仓库名'
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      VERSION_KEY: ${{ secrets.VERSION_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;21.4.7075529 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show generated version info
        run: |
          echo "BUILD_FLAVOR=$BUILD_FLAVOR"
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "BUILD_SOURCE=$BUILD_SOURCE"

      # CI runner 在 GitHub（境外），腾讯镜像偶发连接超时（run #77）；本地开发仍是国内网络，
      # 保留腾讯镜像。此处仅 CI 内把 distributionUrl 改写为官方源，wrapper 缓存目录按 URL 哈希
      # 区分，改写后下载走 services.gradle.org，更稳。官方源极少抖动，下面预热重试 5 次兜底即可。
      - name: Use official Gradle distribution in CI
        run: |
          # 只替换镜像主机+路径前缀，保留 properties 的 \: 转义写法（sed 里 \: 会匹配普通冒号，
          # 直接匹配含转义的 URL 会失效）；替换后 URL 变为 https\://services.gradle.org/distributions/...
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle#services.gradle.org/distributions#g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Warm up Gradle wrapper (retry)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && break
            echo "wrapper download attempt $i failed, retrying in 5s"
            sleep 5
          done
          ./gradlew --version

      - name: Build release APK (alpha)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_release
          path: app/build/outputs/apk/release/*.apk

      # ===== 手动触发才执行：同步到 Gitee 私密仓库 Release（明文 APK + 加密版本文件） =====
      # App「检查更新」从私密仓库拉取 .dat（XOR 密文）→ 下载明文 APK（拼 access_token）→ 直接安装。
      # 需配置 Secrets：GITEE_TOKEN（私密仓库写权限令牌）、VERSION_KEY（.dat 加密，与 App 内置一致）。
      # App 内置 APP_TOKEN（只读令牌）拉取私密仓库文件/附件。
      - name: Extract version from APK (aapt)
        if: github.event_name == 'workflow_dispatch'
        id: gitee_version
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          AAPT=$ANDROID_HOME/build-tools/36.0.0/aapt
          BADGING=$($AAPT dump badging "$APK")
          VC=$(echo "$BADGING" | grep -oP "versionCode='\K[0-9]+" | head -1)
          VN=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" | head -1)
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK + version file to Gitee Release
        if: github.event_name == 'workflow_dispatch' && env.GITEE_TOKEN != ''
        run: |
          python3 scripts/publish_gitee.py \
            --version-code "${{ steps.gitee_version.outputs.version_code }}" \
            --version-name "${{ steps.gitee_version.outputs.version_name }}" \
            --apk "${{ steps.gitee_version.outputs.apk }}" \
            --tag "dailyTask-${{ env.BUILD_NUMBER }}" \
            --ref "${{ github.sha }}" \
            --note "${{ inputs.note }}" \
            --force "${{ inputs.force == 'true' && '1' || '0' }}" \
            --owner "$GITEE_OWNER" \
            --repo "$GITEE_REPO" \
            --token "$GITEE_TOKEN" \
            --key "$VERSION_KEY"

      # 自动构建成功：把当前时间戳写入仓库文件 last_auto_build（rate-check 据此限流）。
      # commit 带 [ci skip] 不会再次触发本 workflow，避免递归。
      - name: Record last auto build timestamp
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$(date +%s)" > last_auto_build
          git add last_auto_build
          git commit -m "chore: record last auto build timestamp [ci skip]" || echo "时间戳无变化，跳过提交"
          git push origin alpha
