name: Build Alpha（AI优化版本）

on:
  push:
    branches: [alpha]
  workflow_dispatch:

jobs:
  build:
    name: Build APK(alpha自动版本)
    runs-on: ubuntu-latest

    # alpha 构建：注入环境变量，build.gradle 据此生成
    # versionName = alpha-<编译时间 yyyyMMddHHmm>-<git短哈希>
    # versionCode = 自增构建号（单调递增，来自 github.run_number）
    env:
      BUILD_FLAVOR: alpha
      GIT_COMMIT_SHORT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      # 构建来源标识：CI 产物版本号带 -ci 后缀，本机手工编译带 -local，便于一眼区分包的出处。
      # GITHUB_ACTIONS 环境变量本可自动识别，此处显式声明以防迁移到其他 CI 时失效。
      BUILD_SOURCE: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;21.4.7075529 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show generated version info
        run: |
          echo "BUILD_FLAVOR=$BUILD_FLAVOR"
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "BUILD_SOURCE=$BUILD_SOURCE"

      # Gradle wrapper 下载发行版（腾讯镜像）偶发连接超时导致整个构建中断（如 run #77），
      # 先带重试预热发行版缓存，成功后 build 步骤直接复用，避免偶发网络抖动打断 CI。
      - name: Warm up Gradle wrapper (retry)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && break
            echo "wrapper download attempt $i failed, retrying in 5s"
            sleep 5
          done
          ./gradlew --version

      - name: Build debug APK (alpha)
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (alpha)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_release
          path: app/build/outputs/apk/release/*.apk
