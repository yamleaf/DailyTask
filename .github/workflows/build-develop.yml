name: Build Alpha（AI优化版本）

on:
  push:
    branches: [alpha]
  workflow_dispatch:

jobs:
  build:
    name: Build APK(alpha自动版本)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # alpha 构建：注入环境变量，build.gradle 据此生成
    # versionName = alpha-<编译时间 yyyyMMddHHmm>-<git短哈希>
    # versionCode = 自增构建号（单调递增，来自 github.run_number）
    env:
      BUILD_FLAVOR: alpha
      GIT_COMMIT_SHORT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;21.4.7075529 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show generated version info
        run: |
          echo "BUILD_FLAVOR=$BUILD_FLAVOR"
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT"
          echo "BUILD_NUMBER=$BUILD_NUMBER"

      - name: Build debug APK (alpha)
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (alpha)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release（手动触发时附 APK）
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-${{ github.run_number }}-${{ github.sha }}
          name: DailyTask Alpha Build #${{ github.run_number }}
          body: |
            由 GitHub Actions 自动构建的 alpha 版本。

            - 分支：${{ github.ref_name }}
            - 提交：${{ github.sha }}
            - 说明：本版本用于体验与测试，正式版请关注 Release 标签。
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: true
