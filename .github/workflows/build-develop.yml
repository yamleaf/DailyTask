name: Build Alpha（AI优化版本）

on:
  push:
    branches: [alpha]
  workflow_dispatch:

jobs:
  build:
    name: Build APK(alpha自动版本)
    runs-on: ubuntu-latest

    # alpha 构建：注入环境变量，build.gradle 据此生成
    # versionName = alpha-<编译时间 yyyyMMddHHmm>-<git短哈希>
    # versionCode = 自增构建号（单调递增，来自 github.run_number）
    env:
      BUILD_FLAVOR: alpha
      GIT_COMMIT_SHORT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      # 构建来源标识：CI 产物版本号带 -ci 后缀，本机手工编译带 -local，便于一眼区分包的出处。
      # GITHUB_ACTIONS 环境变量本可自动识别，此处显式声明以防迁移到其他 CI 时失效。
      BUILD_SOURCE: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;21.4.7075529 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show generated version info
        run: |
          echo "BUILD_FLAVOR=$BUILD_FLAVOR"
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "BUILD_SOURCE=$BUILD_SOURCE"

      # CI runner 在 GitHub（境外），腾讯镜像偶发连接超时（run #77）；本地开发仍是国内网络，
      # 保留腾讯镜像。此处仅 CI 内把 distributionUrl 改写为官方源，wrapper 缓存目录按 URL 哈希
      # 区分，改写后下载走 services.gradle.org，更稳。官方源极少抖动，下面预热重试 5 次兜底即可。
      - name: Use official Gradle distribution in CI
        run: |
          # 只替换镜像主机+路径前缀，保留 properties 的 \: 转义写法（sed 里 \: 会匹配普通冒号，
          # 直接匹配含转义的 URL 会失效）；替换后 URL 变为 https\://services.gradle.org/distributions/...
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle#services.gradle.org/distributions#g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Warm up Gradle wrapper (retry)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && break
            echo "wrapper download attempt $i failed, retrying in 5s"
            sleep 5
          done
          ./gradlew --version

      - name: Build debug APK (alpha)
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (alpha)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_release
          path: app/build/outputs/apk/release/*.apk
