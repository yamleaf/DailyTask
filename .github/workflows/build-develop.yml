name: Build Alpha（AI优化版本）

on:
  push:
    branches: [alpha]
  workflow_dispatch:
    inputs:
      note:
        description: '更新说明（同步到 Gitee Release；多行请用 \n 分隔）'
        required: false
        default: '常规更新'
      force:
        description: '强制更新（true 时 App 必须更新）'
        required: false
        default: 'false'

permissions:
  contents: write
  # 自动编译限流：时间戳存 GitHub Actions Cache（GITHUB_TOKEN 可读写 cache；
  # repository variables API 对 GITHUB_TOKEN 写受限 403，故改用 cache，不污染仓库提交历史）
  actions: write

jobs:
  # 自动编译限流：时间戳存 GitHub Actions Cache（不再写入仓库文件/提交，避免每次自动编译
  # 都产生一条 [ci skip] 噪音 commit）。cache key 带 run_id 保证每次唯一可写；
  # restore 用 restore-keys 前缀匹配取最新一条。manual 直接放行；push 走"每小时一次"检查
  # （build 成功后 save 新时间戳条目）。
  rate-check:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      # 恢复上次自动编译时间戳（cache 命中即拿到最近一次 save 的值）
      - name: Restore last auto build timestamp (Actions cache)
        uses: actions/cache/restore@v4
        with:
          path: last_auto_build
          key: last-auto-build-${{ github.ref_name }}
          restore-keys: last-auto-build-${{ github.ref_name }}
      - name: Rate limit auto builds (once per hour)
        id: check
        run: |
          # 手动触发不参与限流
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "manual trigger 不参与限流"
            exit 0
          fi
          NOW=$(date +%s)
          if [ -f last_auto_build ]; then
            LAST=$(cat last_auto_build)
          else
            LAST=0
          fi
          LAST=${LAST:-0}
          if [ "$LAST" -gt 0 ] && [ "$((NOW - LAST))" -lt 3600 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "距上次自动编译不足 1 小时，跳过本次自动编译（上次 $LAST）"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "自动编译限流放行（上次 $LAST，距现在 $((NOW - LAST)) 秒）"
          fi

  build:
    needs: rate-check
    # rate-check 永远会跑并输出 allowed：push 走限流/manual 直接放行
    if: needs.rate-check.outputs.allowed == 'true'
    name: Build APK(alpha自动版本)
    runs-on: ubuntu-latest

    # alpha 构建：注入环境变量，build.gradle 据此生成
    # versionName = alpha-<编译时间 yyyyMMddHHmm>-<git短哈希>
    # versionCode = 自增构建号（单调递增，来自 github.run_number）
    env:
      BUILD_FLAVOR: alpha
      GIT_COMMIT_SHORT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      # 构建来源标识：CI 产物版本号带 -ci 后缀，本机手工编译带 -local，便于一眼区分包的出处。
      # GITHUB_ACTIONS 环境变量本可自动识别，此处显式声明以防迁移到其他 CI 时失效。
      BUILD_SOURCE: ci
      # secrets 不能直接出现在 step 的 if 表达式里，故先落到 job 级 env，
      # 未配置 Secret 时该变量为空字符串，if 判断按 env. 读取。
      APK_ENCRYPT_PASSWORD: ${{ secrets.APK_ENCRYPT_PASSWORD }}
      # 发版已改为本地执行（scripts/publish_local.sh）：GitHub CI（美国）跨境上传
      # Gitee（国内）极慢（实测 >9min），本地跑 ~30s。故 CI 不再持有 Gitee 凭据；
      # 本地发版需 GITEE_TOKEN（写权限）+ VERSION_KEY（与 App 内置一致）。

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;21.4.7075529 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show generated version info
        run: |
          echo "BUILD_FLAVOR=$BUILD_FLAVOR"
          echo "GIT_COMMIT_SHORT=$GIT_COMMIT_SHORT"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "BUILD_SOURCE=$BUILD_SOURCE"

      # CI runner 在 GitHub（境外），腾讯镜像偶发连接超时（run #77）；本地开发仍是国内网络，
      # 保留腾讯镜像。此处仅 CI 内把 distributionUrl 改写为官方源，wrapper 缓存目录按 URL 哈希
      # 区分，改写后下载走 services.gradle.org，更稳。官方源极少抖动，下面预热重试 5 次兜底即可。
      - name: Use official Gradle distribution in CI
        run: |
          # 只替换镜像主机+路径前缀，保留 properties 的 \: 转义写法（sed 里 \: 会匹配普通冒号，
          # 直接匹配含转义的 URL 会失效）；替换后 URL 变为 https\://services.gradle.org/distributions/...
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle#services.gradle.org/distributions#g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Warm up Gradle wrapper (retry)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && break
            echo "wrapper download attempt $i failed, retrying in 5s"
            sleep 5
          done
          ./gradlew --version

      - name: Build release APK (alpha)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dailyTask_alpha_release
          path: app/build/outputs/apk/release/*.apk

      # ===== 手动触发：dump APK 版本号，供 GitHub Release Draft 展示（版本信息发版在本地执行） =====
      - name: Extract version from APK (aapt)
        if: github.event_name == 'workflow_dispatch'
        id: gitee_version
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          AAPT=$ANDROID_HOME/build-tools/36.0.0/aapt
          BADGING=$($AAPT dump badging "$APK")
          VC=$(echo "$BADGING" | grep -oP "versionCode='\K[0-9]+" | head -1)
          VN=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" | head -1)
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ===== 手动触发：APK 加密为 7z（AES-256，密码=APK_ENCRYPT_PASSWORD）供 Gitee Go 拉取解压 =====
      # GitHub 仓库公开 → release 资产公开，加密防直接下载；Gitee 私有仓库存明文 APK。
      - name: Encrypt APK (7z AES-256)
        if: github.event_name == 'workflow_dispatch'
        run: |
          pip install py7zr -q
          python3 - <<'EOF'
          import glob, os, py7zr
          apk = glob.glob('app/build/outputs/apk/release/*.apk')[0]
          out = 'dailyTask_release_%s.7z' % os.path.basename(apk)
          with py7zr.SevenZipFile(out, 'w', password=os.environ['APK_ENCRYPT_PASSWORD']) as z:
              z.write(apk, os.path.basename(apk))
          print('加密包:', out)
          EOF

      # ===== 发版（上传 APK + .dat 到 Gitee）已改为本地执行 =====
      # 原因：GitHub CI（美国）跨境上传 Gitee（国内）极慢（实测 >9min），
      # 本地跑 scripts/publish_local.sh 约 30s（clone 4s + push 14s + API 几秒）。
      # 发版命令示例：
      #   GITEE_TOKEN=<写权限令牌> bash scripts/publish_local.sh --note "更新说明"

      # ===== 手动触发：生成 GitHub Release Draft（标题 DailyTask Alpha yymmdd.HHmm，
      # body 总结自上次 release tag 以来的提交记录） =====
      - name: Prepare GitHub Release info (title date + body commits)
        if: github.event_name == 'workflow_dispatch'
        id: gh_release_info
        run: |
          # 标题日期时间（北京时间 yymmdd.HHmm，例 260816.1435 = 2026-08-16 14:35）
          TITLE_DATE=$(TZ='Asia/Shanghai' date +%y%m%d.%H%M)
          echo "title_date=$TITLE_DATE" >> "$GITHUB_OUTPUT"

          # 自上次 release tag（apk-*）起的提交记录；无 tag 时取最近 10 条
          LAST_TAG=$(git tag --list "apk-*" --sort=-version:refname 2>/dev/null | head -1)
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            RANGE_DESC="自 ${LAST_TAG}"
          else
            RANGE="HEAD~10..HEAD"
            RANGE_DESC="最近 10 条"
          fi

          # 多行 body 用 GitHub Actions 多行输出语法（delimiter 包裹）
          # workflow_dispatch 的 note 输入框是单行 input（GitHub UI 限制，无法多行粘贴），
          # 约定用字面 \n 表示换行，这里还原成真换行写进 release body
          NOTE_FMT=$(printf '%s' "${{ inputs.note }}" | sed 's/\\n/\n/g')
          {
            echo "body<<GITEOF"
            echo "### 更新内容（${RANGE_DESC}）"
            echo ""
            git log --pretty=format:"- %s (%h)" "$RANGE" | head -20
            echo ""
            echo "---"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- versionCode: ${{ steps.gitee_version.outputs.version_code }}"
            echo "- versionName: \`${{ steps.gitee_version.outputs.version_name }}\`"
            printf -- "- update note:\n%s\n" "$NOTE_FMT"
            echo "GITEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (encrypted APK, for Gitee Go sync)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # tag 用 versionCode，Gitee Go 据此解析版本号；body 含 versionName/note（Gitee Go 正则提取）
          tag_name: dt-${{ steps.gitee_version.outputs.version_code }}
          name: DailyTask Alpha ${{ steps.gh_release_info.outputs.title_date }}
          body: ${{ steps.gh_release_info.outputs.body }}
          files: |
            dailyTask_release_*.7z

      # 自动构建成功：把当前时间戳写入 GitHub Actions Cache（rate-check 据此限流）。
      # 不用 git commit，避免每次自动编译都产生一条 [ci skip] 噪音提交污染仓库历史。
      # 时间戳文件本身无需 git 跟踪（不入库）。
      - name: Record last auto build timestamp (Actions cache)
        if: github.event_name == 'push'
        run: |
          echo "$(date +%s)" > last_auto_build

      - name: Save last auto build timestamp to Actions cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: last_auto_build
          # key 带 run_id 保证每次唯一（cache 条目不可覆盖）；restore 时用前缀匹配取最新一条
          key: last-auto-build-${{ github.ref_name }}-${{ github.run_id }}
