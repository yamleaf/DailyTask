import java.text.SimpleDateFormat

plugins {
    id('com.android.application')
    id('org.jetbrains.kotlin.android')
}

android {
    namespace 'com.pengxh.daily.app'
    compileSdk 36

    lint {
        disable 'NewerVersionAvailable'
        disable 'GradleDependency'
    }

    defaultConfig {
        applicationId 'com.pengxh.daily.app'
        minSdk 26
        targetSdk 36

        // 版本号策略（alpha 分支）：
        // - 基线版本号自动同步 master 分支的 app/build.gradle（alpha 即基于该主线版本）
        // - 默认（未设置或为 alpha）：alpha 自动版本
        //     versionName = <master基线版本>-alpha-<git短哈希>
        //     versionCode = 日期时间整数 yyMMdd*1000+HHmm（如 2607181153，每次编译分钟级唯一）
        // - 仅当显式设置 BUILD_FLAVOR=release 时回退到 master 固定版本号（正式发版用）
        def baselineVersion = {
            try {
                def proc = 'git show master:app/build.gradle'.execute()
                proc.waitFor()
                if (proc.exitValue() == 0) {
                    def m = proc.text =~ /versionName\s+'(\d+(?:\.\d+)*)'/
                    if (m.find()) return m.group(1)
                }
            } catch (Exception ignored) {}
            return '2.4.2.0'
        }()
        def isAlphaBuild = System.getenv('BUILD_FLAVOR') != 'release'
        if (isAlphaBuild) {
            def gitShort = (System.getenv('GIT_COMMIT_SHORT') ?: 'local').take(7)
            // versionCode 采用日期时间整数 yyMMdd*1000+HHmm（如 2607181153），
            // 既保持日期可读格式，又保证每次编译（分钟级）唯一，避免同天覆盖安装冲突。
            def now = new Date()
            def ymd = new SimpleDateFormat('yyMMdd', Locale.CHINA).format(now).toInteger()
            def hm = new SimpleDateFormat('HHmm', Locale.CHINA).format(now).toInteger()
            def buildDateCode = ymd * 1000 + hm
            versionName "${baselineVersion}-alpha-${gitShort}"
            versionCode buildDateCode
        } else {
            versionCode 2420
            versionName baselineVersion
        }

        ndkVersion '21.4.7075529'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        // 仅保留中文资源（values/ 与 values-zh），剔除依赖库自带的多语言字符串，缩减体积
        resConfigs "zh"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++14"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    flavorDimensions += 'versionCode'

    signingConfigs {
        release {
            storeFile file('DailyTask.jks')
            storePassword '123456789'
            keyAlias 'key0'
            keyPassword '123456789'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

//    GString id = "com.alibaba.android.${randomCode()}"
//    productFlavors {
//        daily {
//            applicationId = id
//        }
//    }

    packagingOptions {
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "dailyTask_v${android.defaultConfig.versionName}_${variant.buildType.name}.apk"
        }
    }
}

static def randomCode() {
    String alphabetsInLowerCase = 'abcdefghijklmnopqrstuvwxyz'
    String randomString = ""
    for (i in 0..5) {
        int randomIndex = Math.random() * alphabetsInLowerCase.length()
        randomString += alphabetsInLowerCase[randomIndex]
    }
    return randomString
}

static def getBuildDate() {
    SimpleDateFormat dateFormat = new SimpleDateFormat('yyyyMMdd', Locale.CHINA)
    return dateFormat.format(System.currentTimeMillis())
}

dependencies {
    implementation project(':lite')
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    //数据库框架
    implementation 'androidx.room:room-runtime:2.8.2'
    annotationProcessor 'androidx.room:room-compiler:2.8.2'
    // 敏感信息加密存储（基于 Android Keystore 的 EncryptedSharedPreferences）
    implementation 'androidx.security:security-crypto:1.1.0'
    //邮件
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation 'com.sun.mail:android-activation:1.6.8'
    //日期、时间选择器
    implementation 'com.github.gzu-liyujiang.AndroidPicker:WheelPicker:4.1.15'
    implementation 'com.google.code.gson:gson:2.14.0'
    //返回值转换器
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    //okhttp3日志拦截器
    implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0'
    //网络请求和接口封装
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    // 绑定二维码生成（ZXing core，仅编解码，无 Android 视图依赖）
    implementation 'com.google.zxing:core:3.4.1'
}
